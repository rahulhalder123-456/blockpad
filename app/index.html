    #splash { position: fixed; inset: 0; z-index: 100000; display: grid; place-items: center; background: radial-gradient(120% 120% at 25% 15%, #2a2570 0%, #17143f 55%, #0e0c2b 100%); color: #fff; pointer-events: none; font: 600 15px/1.3 "Segoe UI", system-ui, -apple-system, Roboto, sans-serif; }
    #splash.out { opacity: 0; transform: scale(1.04); transition: opacity .25s ease, transform .25s ease; }
    #splash .sp-in { display: grid; justify-items: center; gap: 18px; }
    #splash .sp-logo { width: 132px; height: 132px; overflow: visible; filter: drop-shadow(0 18px 34px rgba(8,6,40,.6)) drop-shadow(0 0 28px rgba(122,107,255,.35)); animation: sp-float 2.6s .8s ease-in-out infinite; }
    #splash .sp-tile { transform-box: fill-box; transform-origin: 50% 50%; animation: sp-tile .45s cubic-bezier(.2,.9,.3,1.25) both; }
    #splash .sp-b1 { animation: sp-b1 .4s .15s cubic-bezier(.2,.9,.3,1.2) both; }
    #splash .sp-b2 { animation: sp-b2 .4s .25s cubic-bezier(.2,.9,.3,1.2) both; }
    #splash .sp-name { font-size: 30px; letter-spacing: -.3px; animation: sp-up .35s .35s both; }
    #splash .sp-bar { width: 120px; height: 3px; border-radius: 3px; background: rgba(255,255,255,.14); overflow: hidden; animation: sp-up .3s .5s both; }
    #splash .sp-bar i { display: block; width: 40%; height: 100%; border-radius: 3px; background: #ffb454; animation: sp-bar 1.1s .5s ease-in-out infinite; }
    @keyframes sp-tile { from { transform: scale(.35) rotate(-10deg); opacity: 0; } }
    @keyframes sp-b1 { from { transform: translateX(-16px); opacity: 0; } }
    @keyframes sp-b2 { from { transform: translateX(16px); opacity: 0; } }
    @keyframes sp-up { from { transform: translateY(14px); opacity: 0; } }
    @keyframes sp-float { 50% { transform: translateY(-5px); } }
    @keyframes sp-bar { from { transform: translateX(-110%); } to { transform: translateX(300%); } }
    @media (prefers-reduced-motion: reduce) { #splash *, #splash { animation-duration: .01ms !important; animation-delay: 0s !important; animation-iteration-count: 1 !important; } }
